name: rilis

# Rilis AAB ZX Agent untuk Play Store (pola Z-Rooms-android).
# Dipicu manual: Actions -> rilis -> Run workflow. versiKode naik otomatis.
# Keystore: utamakan file di repo (keystore/rilis.keystore + .pw) — agent lain
# tinggal copy folder keystore/ + rilis.yml ini utk rilis dgn signature sama.
# Fallback: Secrets (KEYSTORE_B64, KEYSTORE_PASSWORD, KEYSTORE_ALIAS, KEYSTORE_KEY_PASSWORD).
# Play Store menolak AAB/APK debug-signed.

on:
  workflow_dispatch:
    inputs:
      versi:
        description: 'Versi rilis (mis. 1.0.0) — tanpa awalan v'
        required: true
        type: string

permissions:
  contents: write

jobs:
  rilis:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pasang JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang build-tools 35.0.0 + platform + cmdline-tools/latest
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMAN=$(command -v sdkmanager || true)
          if [ -z "$SDKMAN" ]; then
            SDKMAN=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "sdkmanager: $SDKMAN (SDK_ROOT=$SDK_ROOT)"
          yes | "$SDKMAN" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMAN" --sdk_root="$SDK_ROOT" \
            --install "build-tools;36.0.0" "platforms;android-36" "cmdline-tools;latest"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Tulis local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Naikkan versi di alamat.json
        env:
          VERSI: ${{ inputs.versi }}
        run: |
          node -e '
            const fs = require("fs");
            const p = "alamat.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            const versi = process.env.VERSI.replace(/^v/, "");
            if (!/^\d+\.\d+\.\d+$/.test(versi)) {
              console.error("versi harus angka bertitik, mis. 1.0.0 — dapat:", versi);
              process.exit(1);
            }
            const lama = j.versiKode;
            j.versiNama = versi;
            j.versiKode = lama + 1;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            console.log(`versi ${versi}, versiKode ${lama} -> ${j.versiKode}`);
          '
          echo "VERSI=$VERSI" >> "$GITHUB_ENV"

      - name: Siapkan keystore (repo dulu, fallback Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -f keystore/rilis.keystore ]; then
            cp keystore/rilis.keystore app/rilis.keystore
            STORE_PW=$(cat keystore/rilis.keystore.pw)
            KEY_PW="${KEYSTORE_KEY_PASSWORD:-$STORE_PW}"
            ALIAS="${KEYSTORE_ALIAS:-zxagent}"
            cat > app/keystore.properties <<EOF
          storeFile=rilis.keystore
          storePassword=$STORE_PW
          keyAlias=$ALIAS
          keyPassword=$KEY_PW
          EOF
          elif [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/rilis.keystore
            cat > app/keystore.properties <<EOF
          storeFile=rilis.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEYSTORE_ALIAS
          keyPassword=$KEYSTORE_KEY_PASSWORD
          EOF
          else
            echo "::error::Keystore tidak ada — taruh keystore/rilis.keystore + .pw di repo, atau isi Secrets (lihat README)."
            exit 1
          fi

      - name: Build rilis (AAB utk Play Store + APK utk pasang langsung)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Ganti nama AAB + APK
        run: |
          mkdir -p rilis
          cp app/build/outputs/bundle/release/app-release.aab "rilis/zx-agent-${VERSI}.aab"
          cp app/build/outputs/apk/release/app-release.apk "rilis/zx-agent-${VERSI}.apk"
          ls -la rilis/

      - name: Commit versi + lampirkan AAB & APK ke Release
        run: |
          set -euo pipefail
          git config user.name "rilis-bot"
          git config user.email "rilis-bot@users.noreply.github.com"
          git add alamat.json
          git commit -m "rilis v${VERSI} (CI)" || echo "tak ada perubahan versi"
          git tag "v${VERSI}"
          git push origin HEAD:"main" --tags
          gh release create "v${VERSI}" "rilis/zx-agent-${VERSI}.aab" "rilis/zx-agent-${VERSI}.apk" \
            --title "ZX Agent v${VERSI}" --notes "Rilis v${VERSI} (AAB Play Store + APK pasang langsung)" \
            || gh release upload "v${VERSI}" "rilis/zx-agent-${VERSI}.aab" "rilis/zx-agent-${VERSI}.apk" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
