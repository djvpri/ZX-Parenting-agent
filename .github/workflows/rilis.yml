name: rilis

# Rilis APK ZX Agent dari GitHub (pola Z-Rooms-android).
# Dipicu manual: Actions -> rilis -> Run workflow. versiKode naik otomatis.
# Keystore dari Secrets: KEYSTORE_B64, KEYSTORE_PASSWORD, KEYSTORE_ALIAS, KEYSTORE_KEY_PASSWORD.
# Tanpa secret, build jalan tapi APK unsigned-debug (untuk fase skeleton cukup).

on:
  workflow_dispatch:
    inputs:
      versi:
        description: 'Versi rilis (mis. 1.0.0) — tanpa awalan v'
        required: true
        type: string

permissions:
  contents: write

jobs:
  rilis:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pasang JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang build-tools 35.0.0 + platform + cmdline-tools/latest
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMAN=$(command -v sdkmanager || true)
          if [ -z "$SDKMAN" ]; then
            SDKMAN=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "sdkmanager: $SDKMAN (SDK_ROOT=$SDK_ROOT)"
          yes | "$SDKMAN" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMAN" --sdk_root="$SDK_ROOT" \
            --install "build-tools;35.0.0" "platforms;android-35" "cmdline-tools;latest"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Tulis local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Naikkan versi di alamat.json
        env:
          VERSI: ${{ inputs.versi }}
        run: |
          node -e '
            const fs = require("fs");
            const p = "alamat.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            const versi = process.env.VERSI.replace(/^v/, "");
            if (!/^\d+\.\d+\.\d+$/.test(versi)) {
              console.error("versi harus angka bertitik, mis. 1.0.0 — dapat:", versi);
              process.exit(1);
            }
            const lama = j.versiKode;
            j.versiNama = versi;
            j.versiKode = lama + 1;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            console.log(`versi ${versi}, versiKode ${lama} -> ${j.versiKode}`);
          '
          echo "VERSI=$VERSI" >> "$GITHUB_ENV"

      - name: Tulis keystore dari Secrets (jika ada)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "KEYSTORE_B64 kosong — build lanjut tanpa keystore rilis (APK debug-signed)."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/rilis.keystore
          cat > app/keystore.properties <<EOF
          storeFile=rilis.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEYSTORE_ALIAS
          keyPassword=$KEYSTORE_KEY_PASSWORD
          EOF

      - name: Build rilis
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Ganti nama APK
        run: |
          mkdir -p rilis
          cp app/build/outputs/apk/release/app-release*.apk "rilis/zx-agent-${VERSI}.apk"
          ls -la rilis/

      - name: Commit versi + lampirkan APK ke Release
        run: |
          set -euo pipefail
          git config user.name "rilis-bot"
          git config user.email "rilis-bot@users.noreply.github.com"
          git add alamat.json
          git commit -m "rilis v${VERSI} (CI)" || echo "tak ada perubahan versi"
          git tag "v${VERSI}"
          git push origin HEAD:"main" --tags
          gh release create "v${VERSI}" "rilis/zx-agent-${VERSI}.apk" \
            --title "ZX Agent v${VERSI}" --notes "Rilis v${VERSI}" \
            || gh release upload "v${VERSI}" "rilis/zx-agent-${VERSI}.apk" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
